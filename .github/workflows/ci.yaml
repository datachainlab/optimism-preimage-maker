name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

env:
  DEVNET_REF: v1.6.0-rc2
  KURTOSIS_VERSION: 1.18.1

jobs:
  lint:
    name: lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install components
        run: |
          rustup component add rustfmt clippy
          cargo install cargo-machete --version 0.8.0 --locked
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check clippy
        run: cargo clippy --locked -- -D warnings
      - name: Check deps
        run: cargo machete
  test:
    name: test
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Clean up unnecessary packages
        run: |
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
          docker system prune -a --volumes -f
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.40.0
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v1.0.0'
      - name: Install kurtosis
        # The apt repo at apt.fury.io stops at 1.15.2, so install the release tarball
        # instead. optimism-devnet's kurtosis SDK refuses to talk to an older engine.
        run: |
          sudo apt-get install -y jq
          curl -fsSL -o /tmp/kurtosis.tar.gz \
            "https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/kurtosis-cli_${KURTOSIS_VERSION}_linux_amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/kurtosis.tar.gz kurtosis
          kurtosis version
      - name: Clone optimism-devnet
        run: git clone --depth 1 -b ${{ env.DEVNET_REF }} https://github.com/datachainlab/optimism-devnet.git ../optimism-devnet
      - name: Start optimism
        run: |
          make chain
          make devnet-up
        working-directory: ../optimism-devnet
      - name: Setup ports and deploy contracts
        run: |
          make set-port
          make test-deploy-tx
          sleep 30
          make test-tx
      - name: Start preimage server
        run: make server-up &
      - name: Wait for chain to get ready
        run: make wait
      - name: Test
        run: make test
      - name: Stop devnet
        if: always()
        run: make devnet-down
        working-directory: ../optimism-devnet
