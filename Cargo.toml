[workspace]
resolver = "2"
members = [
    "server",
]

[workspace.dependencies]
anyhow = { version="1.0.98", default-features = false }
hashbrown = "0.16.0"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false }

# Kona
# kona-node/v1.11.0. Pinned by commit: upstream tagged v1.11.0 on top of the
# v1.11.0-rc.1 tag object, and cargo peels only one level, so the tag name does
# not resolve to a commit.
kona-client = { git="https://github.com/ethereum-optimism/optimism", rev= "72fcf9479ea7ee1105b823d23da8bf58ba58136d", default-features = false }
kona-host = { git="https://github.com/ethereum-optimism/optimism", rev= "72fcf9479ea7ee1105b823d23da8bf58ba58136d", default-features = false }
kona-proof = { git="https://github.com/ethereum-optimism/optimism", rev= "72fcf9479ea7ee1105b823d23da8bf58ba58136d", default-features = false }
kona-preimage = {git="https://github.com/ethereum-optimism/optimism", rev= "72fcf9479ea7ee1105b823d23da8bf58ba58136d", default-features = false }
kona-genesis = { git="https://github.com/ethereum-optimism/optimism", rev= "72fcf9479ea7ee1105b823d23da8bf58ba58136d", default-features = false }
kona-registry = { git="https://github.com/ethereum-optimism/optimism", rev= "72fcf9479ea7ee1105b823d23da8bf58ba58136d", default-features = false }

# Alloy
alloy-primitives = { version = "1.6.0", default-features = false }


